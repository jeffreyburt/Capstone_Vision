# Install as /etc/systemd/system/capstone-drive-1.service.d/fourwheel.conf
# System Python provides lgpio/gpiozero; editable capstone-base source supplies the I2C driver.
[Service]
Environment=PYTHONPATH=/home/robot-pi1/capstone-base/src
ExecStart=
ExecStart=/usr/bin/python3 -u /home/robot-pi1/capstone-drive/drive_server.py --robot-id 1 --hardware --hiwonder-config /home/robot-pi1/capstone-drive/robot1_four_wheels.json --allow-from 192.168.50.1 --require-compensated-pose --turn-radius 0.2 --timeout 0.5
